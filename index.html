<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Simulation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#0ff;font-family:'Courier New',monospace;overflow:hidden;width:100vw;height:100vh}
#game-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.15)0px,rgba(0,0,0,0.15)1px,transparent 1px,transparent 3px);z-index:1000;pointer-events:none}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none}
#ui-layer>*{pointer-events:auto}
#hud{position:absolute;top:10px;left:10px;right:10px;display:none;font-size:14px}
.hud-bar{height:20px;border:1px solid;border-radius:2px;margin:2px 0;position:relative;overflow:hidden}
.hud-bar-fill{height:100%;transition:width 0.3s}
.hp-bar{border-color:#f0f}.hp-fill{background:linear-gradient(90deg,#f0f,#f66)}
.xp-bar{border-color:#0f0}.xp-fill{background:linear-gradient(90deg,#0a0,#0f0)}
.hud-left{float:left;width:200px}.hud-right{float:right;text-align:right}
.hud-center{text-align:center}
#dialog-box{display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:600px;max-width:90%;background:rgba(0,10,20,0.95);border:1px solid #0ff;padding:15px;border-radius:4px;font-size:14px}
#dialog-speaker{color:#f0f;font-weight:bold;margin-bottom:5px}
#dialog-text{color:#0ff;line-height:1.4}
#dialog-options{margin-top:10px}
.dialog-opt{display:block;color:#0f0;cursor:pointer;padding:4px;margin:2px 0;border:1px solid transparent}
.dialog-opt:hover{border-color:#0f0;background:rgba(0,255,0,0.1)}
#overlay-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,5,10,0.97);z-index:50}
.overlay-panel{background:rgba(0,10,20,0.95);border:1px solid #0ff;padding:30px;border-radius:4px;max-width:700px;width:90%;max-height:90vh;overflow-y:auto}
.overlay-panel h1,.overlay-panel h2{color:#f0f;text-align:center;margin-bottom:15px;text-shadow:0 0 10px #f0f}
.overlay-panel h1{font-size:28px}
.btn{display:inline-block;padding:10px 24px;margin:5px;border:1px solid #0ff;background:rgba(0,255,255,0.1);color:#0ff;cursor:pointer;font-family:inherit;font-size:14px;transition:all 0.2s}
.btn:hover{background:rgba(0,255,255,0.3);box-shadow:0 0 15px rgba(0,255,255,0.3)}
.btn-magenta{border-color:#f0f;color:#f0f;background:rgba(255,0,255,0.1)}
.btn-magenta:hover{background:rgba(255,0,255,0.3)}
.btn-green{border-color:#0f0;color:#0f0;background:rgba(0,255,0,0.1)}
.btn-green:hover{background:rgba(0,255,0,0.3)}
input[type="text"],input[type="number"]{background:rgba(0,20,40,0.8);border:1px solid #0ff;color:#0ff;padding:8px;font-family:inherit;font-size:14px;width:100%}
.class-card{display:inline-block;width:180px;border:1px solid #555;padding:15px;margin:8px;cursor:pointer;text-align:center;vertical-align:top;transition:all 0.2s}
.class-card:hover,.class-card.selected{border-color:#0ff;box-shadow:0 0 15px rgba(0,255,255,0.3)}
.class-card h3{color:#f0f;margin-bottom:8px}
.class-card p{font-size:12px;color:#888}
.stat-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0;padding:4px}
.stat-row label{width:80px;color:#0ff}.stat-row span{color:#0f0;width:30px;text-align:center}
.stat-btn{width:28px;height:28px;border:1px solid #0ff;background:rgba(0,255,255,0.1);color:#0ff;cursor:pointer;font-size:16px}
.stat-btn:hover{background:rgba(0,255,255,0.3)}
.stat-btn:disabled{opacity:0.3;cursor:default}
#inventory-panel,#map-panel,#menu-panel{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60}
.panel-inner{background:rgba(0,10,20,0.97);border:1px solid #0ff;padding:20px;border-radius:4px;min-width:400px;max-width:600px;max-height:80vh;overflow-y:auto}
.item-slot{display:inline-block;width:60px;height:60px;border:1px solid #333;margin:3px;text-align:center;line-height:60px;font-size:10px;cursor:pointer;vertical-align:top;position:relative}
.item-slot:hover{border-color:#0ff}
.item-slot .item-name{position:absolute;bottom:2px;left:2px;right:2px;font-size:8px;color:#0f0}
.shop-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #222;cursor:pointer}
.shop-item:hover{background:rgba(0,255,255,0.1)}
.zone-indicator{position:absolute;top:50px;left:50%;transform:translateX(-50%);color:#f0f;font-size:18px;text-shadow:0 0 10px #f0f;transition:opacity 0.5s;z-index:20}
#hack-minigame{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;background:rgba(0,5,10,0.98);border:2px solid #0f0;padding:20px;border-radius:4px;width:500px;max-width:95%}
#hack-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}
.hack-cell{width:50px;height:50px;border:1px solid #0f0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.15s}
.hack-cell:hover{background:rgba(0,255,0,0.2)}
.hack-cell.matched{background:rgba(0,255,0,0.4);border-color:#0ff}
.hack-cell.wrong{background:rgba(255,0,0,0.4);border-color:#f00}
#hack-timer{height:8px;background:#0f0;transition:width 0.1s linear;margin-top:10px}
#combat-log{position:absolute;bottom:10px;left:10px;width:280px;max-height:150px;overflow-y:auto;font-size:11px;color:#888;display:none}
.log-dmg{color:#f66}.log-heal{color:#0f0}.log-info{color:#0ff}.log-hack{color:#f0f}
#ability-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:none;z-index:15}
.ability-slot{display:inline-block;width:50px;height:50px;border:1px solid #0ff;margin:0 3px;text-align:center;line-height:50px;font-size:10px;position:relative;background:rgba(0,10,20,0.8)}
.ability-cd{position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,0.7);color:#f0f;font-size:12px}
.ability-key{position:absolute;bottom:2px;right:3px;font-size:9px;color:#888}
#notification{position:absolute;top:80px;left:50%;transform:translateX(-50%);color:#0f0;font-size:16px;text-shadow:0 0 10px #0f0;opacity:0;transition:opacity 0.4s;z-index:25;text-align:center}
#boss-hp{display:none;position:absolute;top:60px;left:50%;transform:translateX(-50%);width:400px;max-width:80%;z-index:20}
#boss-hp .hud-bar{height:14px;border-color:#f00}
#boss-hp .hud-bar-fill{background:linear-gradient(90deg,#f00,#f60)}
#boss-hp .boss-name{text-align:center;color:#f00;font-size:12px;margin-bottom:2px}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="scanlines"></div>
<div id="ui-layer">
  <div id="hud">
    <div class="hud-left">
      <div id="hud-name" style="color:#f0f;margin-bottom:4px">Player</div>
      <div>HP</div><div class="hud-bar hp-bar"><div class="hp-fill hud-bar-fill" id="hp-fill"></div></div>
      <div>XP</div><div class="hud-bar xp-bar"><div class="xp-fill hud-bar-fill" id="xp-fill"></div></div>
      <div id="hud-level" style="font-size:12px;color:#0f0">Lv 1</div>
    </div>
    <div class="hud-right">
      <div id="hud-credits" style="color:#ff0">Credits: 0</div>
      <div id="hud-zone" style="color:#f0f;font-size:12px">Downtown</div>
    </div>
  </div>
  <div id="boss-hp"><div class="boss-name" id="boss-name">BOSS</div><div class="hud-bar"><div class="hud-bar-fill" id="boss-hp-fill"></div></div></div>
  <div id="dialog-box"><div id="dialog-speaker"></div><div id="dialog-text"></div><div id="dialog-options"></div></div>
  <div id="notification"></div>
  <div id="combat-log"></div>
  <div id="ability-bar"></div>
  <div id="overlay-screen"></div>
  <div id="inventory-panel"><div class="panel-inner" id="inv-inner"></div></div>
  <div id="map-panel"><div class="panel-inner" id="map-inner"></div></div>
  <div id="menu-panel"><div class="panel-inner" id="menu-inner"></div></div>
  <div id="hack-minigame"></div>
</div>
<script>
'use strict';
// ============================================================
// CORE ENGINE
// ============================================================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const MAX_DELTA = 50;
const MAX_ENEMIES = 50;
const MAX_PARTICLES = 100;
const WAVE_THRESHOLD = 10;

function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resizeCanvas);resizeCanvas();

// Input
const keys={};
let mouseX=0,mouseY=0,mouseDown=false,mouseClicked=false;
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['i','m','escape','e','h'].includes(e.key.toLowerCase()))e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
canvas.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});
canvas.addEventListener('mousedown',e=>{mouseDown=true;mouseClicked=true});
canvas.addEventListener('mouseup',e=>{mouseDown=false});

// Object pools
const entityPool=[];
const particlePool=[];
function getEntity(){return entityPool.pop()||{}}
function releaseEntity(e){e.active=false;entityPool.push(e)}
function getParticle(){return particlePool.pop()||{}}
function releaseParticle(p){p.active=false;particlePool.push(p)}

// Game state
const G={
  phase:0, running:false, frameCount:0, lastTime:0,
  player:null, entities:[], particles:[], timers:[],
  camera:{x:0,y:0},
  world:{width:2000,height:2000},
  zone:'downtown',
  zones:{
    downtown:{name:'Downtown',color:'#0af',x:0,y:0,w:2000,h:2000,
      npcs:[{x:300,y:300,name:'Fixer',dialog:'fixerDialog',sprite:'npc'},{x:800,y:400,name:'Info Broker',dialog:'infoBrokerDialog',sprite:'npc'}],
      terminals:[{x:600,y:600,hacked:false}],
      shopItems:[{name:'Stim Pack',type:'consumable',stat:'hp',val:30,cost:50},{name:'Nano Blade',type:'weapon',stat:'attack',val:5,cost:200},{name:'ICE Breaker',type:'tool',stat:'hacking',val:3,cost:150}]},
    slums:{name:'Slums',color:'#f80',x:-2000,y:0,w:2000,h:2000,
      npcs:[{x:400,y:500,name:'Street Doc',dialog:'streetDocDialog',sprite:'npc'}],
      terminals:[{x:900,y:300,hacked:false}],
      shopItems:[{name:'Medkit',type:'consumable',stat:'hp',val:50,cost:80},{name:'Shock Gloves',type:'weapon',stat:'attack',val:3,cost:100}]},
    corporate:{name:'Corporate District',color:'#f0f',x:0,y:-2000,w:2000,h:2000,
      npcs:[{x:500,y:600,name:'Corp Agent',dialog:'corpDialog',sprite:'npc'}],
      terminals:[{x:700,y:200,hacked:false}],
      shopItems:[{name:'Cyber Deck v2',type:'tool',stat:'hacking',val:5,cost:300},{name:'Reflex Booster',type:'augment',stat:'speed',val:3,cost:250}]},
    industrial:{name:'Industrial Zone',color:'#0f0',x:-2000,y:-2000,w:2000,h:2000,
      npcs:[{x:300,y:800,name:'Mechanic',dialog:'mechDialog',sprite:'npc'}],
      terminals:[{x:1200,y:500,hacked:false}],
      shopItems:[{name:'Armor Plating',type:'augment',stat:'defense',val:5,cost:200},{name:'EMP Grenade',type:'consumable',stat:'attack',val:20,cost:120}]}
  },
  missions:[],
  activeMission:null,
  inventory:[],
  credits:100,
  xp:0,xpNext:100,level:1,
  dialogQueue:[],
  notifications:[],
  wave:0,waveEnemies:0,
  bossHP:0,bossMaxHP:0,bossName:'',
  hackCallback:null,
  shopOpen:false,currentShop:null,
  saves:{}
};

// Stats template
function makePlayer(name,cls){
  const bases={
    netrunner:{hp:80,maxHp:80,attack:8,defense:4,hacking:12,speed:5},
    'street samurai':{hp:120,maxHp:120,attack:14,defense:8,hacking:3,speed:7},
    techie:{hp:100,maxHp:100,attack:10,defense:6,hacking:8,speed:5}
  };
  const b=bases[cls]||bases.netrunner;
  return{name,cls,x:400,y:400,w:24,h:32,...b,
    cooldowns:{melee:0,ranged:0,cyber:0},
    abilities:getAbilities(cls),
    facing:1,attacking:false,attackTimer:0,invuln:0,
    velX:0,velY:0};
}
function getAbilities(cls){
  const common=[{name:'Melee',key:'LMB',cd:500,dmgMul:1,range:50,type:'melee'},
    {name:'Ranged',key:'RMB',cd:1000,dmgMul:0.8,range:300,type:'ranged'}];
  const specials={
    netrunner:[{name:'Neural Spike',key:'Q',cd:3000,dmgMul:2,range:200,type:'cyber'}],
    'street samurai':[{name:'Blade Storm',key:'Q',cd:4000,dmgMul:2.5,range:80,type:'melee'}],
    techie:[{name:'Turret Deploy',key:'Q',cd:5000,dmgMul:1.5,range:250,type:'ranged'}]
  };
  return[...common,...(specials[cls]||specials.netrunner)];
}

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function rand(a,b){return Math.random()*(b-a)+a}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function lerp(a,b,t){return a+(b-a)*t}

function notify(text,dur=2000){
  const el=document.getElementById('notification');
  el.textContent=text;el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',dur);
}

function addLog(text,cls='log-info'){
  const log=document.getElementById('combat-log');
  const d=document.createElement('div');d.className=cls;d.textContent=text;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(log.children.length>50)log.removeChild(log.firstChild);
}

function spawnParticle(x,y,color,life=500,vx,vy){
  if(G.particles.filter(p=>p.active).length>=MAX_PARTICLES){
    const oldest=G.particles.find(p=>p.active);
    if(oldest)oldest.active=false;
  }
  let p=G.particles.find(pp=>!pp.active);
  if(!p){p=getParticle();G.particles.push(p)}
  p.x=x;p.y=y;p.vx=vx||rand(-2,2);p.vy=vy||rand(-2,2);
  p.color=color;p.life=life;p.maxLife=life;p.active=true;p.size=rand(2,5);
}

function spawnEnemy(x,y,type,zone){
  const active=G.entities.filter(e=>e.active&&e.type==='enemy');
  if(active.length>=MAX_ENEMIES)return null;
  let e=G.entities.find(en=>!en.active&&en.type==='enemy');
  if(!e){e=getEntity();G.entities.push(e)}
  const templates={
    grunt:{hp:30,maxHp:30,attack:5,defense:2,speed:1.5,w:20,h:28,color:'#f44',xpVal:15,creditVal:10},
    enforcer:{hp:60,maxHp:60,attack:10,defense:5,speed:1,w:24,h:32,color:'#f80',xpVal:30,creditVal:25},
    drone:{hp:20,maxHp:20,attack:8,defense:1,speed:3,w:16,h:16,color:'#ff0',xpVal:20,creditVal:15},
    cyber:{hp:50,maxHp:50,attack:12,defense:4,speed:2,w:22,h:30,color:'#f0f',xpVal:35,creditVal:30},
    boss:{hp:500,maxHp:500,attack:20,defense:10,speed:1.2,w:40,h:48,color:'#f00',xpVal:200,creditVal:500}
  };
  const t=templates[type]||templates.grunt;
  Object.assign(e,t,{x,y,type:'enemy',enemyType:type,active:true,
    zone:zone||G.zone,aiTimer:0,aiState:'patrol',
    targetX:x+rand(-100,100),targetY:y+rand(-100,100),
    attackCd:0,hitFlash:0,facing:1});
  return e;
}

function damageEntity(target,amount,source){
  const def=target.defense||0;
  const dmg=Math.max(1,Math.round(amount-def*0.5));
  target.hp-=dmg;target.hitFlash=150;
  for(let i=0;i<5;i++)spawnParticle(target.x,target.y,'#f44',300);
  if(target===G.player){
    addLog(`You take ${dmg} damage!`,'log-dmg');
  }else{
    addLog(`Hit for ${dmg} damage!`,'log-dmg');
  }
  if(target.hp<=0){
    target.hp=0;
    if(target!==G.player){
      target.active=false;
      G.xp+=target.xpVal||10;
      G.credits+=target.creditVal||5;
      for(let i=0;i<10;i++)spawnParticle(target.x,target.y,target.color,500);
      addLog(`Enemy destroyed! +${target.xpVal}XP +${target.creditVal}cr`,'log-info');
      checkLevelUp();
      if(G.activeMission)checkMissionProgress('kill');
    }else{
      handlePlayerDeath();
    }
  }
  return dmg;
}

function checkLevelUp(){
  while(G.xp>=G.xpNext){
    G.xp-=G.xpNext;G.level++;G.xpNext=Math.floor(G.xpNext*1.5);
    G.player.maxHp+=10;G.player.hp=G.player.maxHp;
    G.player.attack+=2;G.player.defense+=1;G.player.hacking+=1;G.player.speed+=0.3;
    notify(`LEVEL UP! Level ${G.level}`);
    addLog(`Level ${G.level}! Stats increased.`,'log-info');
  }
}

function handlePlayerDeath(){
  notify('SYSTEM FAILURE - Respawning...');
  setTimeout(()=>{
    G.player.hp=G.player.maxHp;
    G.player.x=400;G.player.y=400;G.player.invuln=2000;
    G.credits=Math.max(0,G.credits-50);
  },1500);
}

function saveGame(){
  const data={player:G.player,credits:G.credits,xp:G.xp,xpNext:G.xpNext,
    level:G.level,phase:G.phase,zone:G.zone,inventory:G.inventory,
    missions:G.missions.map(m=>({id:m.id,complete:m.complete}))};
  localStorage.setItem('simulation_save',JSON.stringify(data));
}

function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem('simulation_save'));
    if(d){Object.assign(G.player,d.player);G.credits=d.credits;G.xp=d.xp;
      G.xpNext=d.xpNext;G.level=d.level;G.zone=d.zone;G.inventory=d.inventory||[];return true}
  }catch(e){}return false;
}

// Camera
function updateCamera(){
  const p=G.player;if(!p)return;
  G.camera.x=lerp(G.camera.x,p.x-canvas.width/2,0.1);
  G.camera.y=lerp(G.camera.y,p.y-canvas.height/2,0.1);
}

function worldToScreen(wx,wy){return{x:wx-G.camera.x,y:wy-G.camera.y}}
function isOnScreen(x,y,margin=100){
  const s=worldToScreen(x,y);
  return s.x>-margin&&s.x<canvas.width+margin&&s.y>-margin&&s.y<canvas.height+margin;
}

// ============================================================
// PHASE MANAGEMENT
// ============================================================
const phases=[];
let currentPhase=null;

function setPhase(idx){
  if(currentPhase&&currentPhase.exit)currentPhase.exit();
  // Cleanup
  G.entities.forEach(e=>{e.active=false;entityPool.push(e)});
  G.entities.length=0;
  G.particles.forEach(p=>{p.active=false;particlePool.push(p)});
  G.particles.length=0;
  G.timers.forEach(t=>clearTimeout(t));G.timers.length=0;
  mouseClicked=false;
  G.phase=idx;
  currentPhase=phases[idx];
  if(currentPhase&&currentPhase.enter)currentPhase.enter();
  saveGame();
}
// ============================================================
// PHASE 0: AWAKENING - Character Creation
// ============================================================
phases[0]={
  enter(){
    G.running=false;
    document.getElementById('hud').style.display='none';
    document.getElementById('combat-log').style.display='none';
    document.getElementById('ability-bar').style.display='none';
    const ov=document.getElementById('overlay-screen');
    ov.style.display='flex';
    let selectedClass='netrunner';
    let statPoints=5;
    let bonusStats={hp:0,attack:0,defense:0,hacking:0,speed:0};
    ov.innerHTML=`
      <div class="overlay-panel">
        <h1>THE SIMULATION</h1>
        <p style="text-align:center;color:#888;margin-bottom:20px">Welcome to the machine. Who are you?</p>
        <div style="margin:10px 0"><label style="color:#0f0">Handle:</label>
          <input type="text" id="char-name" value="Ghost" maxlength="16" style="margin-top:5px"></div>
        <h2>Choose Your Path</h2>
        <div style="text-align:center" id="class-select">
          <div class="class-card selected" data-cls="netrunner"><h3>Netrunner</h3><p>Master hacker. High hacking, moderate combat. Neural attacks bypass armor.</p></div>
          <div class="class-card" data-cls="street samurai"><h3>Street Samurai</h3><p>Combat specialist. High HP and attack. Blade storm devastates nearby foes.</p></div>
          <div class="class-card" data-cls="techie"><h3>Techie</h3><p>Gadget expert. Balanced stats. Deploy turrets for ranged support.</p></div>
        </div>
        <h2 style="margin-top:15px">Allocate Stats <span id="stat-pts" style="color:#0f0">(${statPoints} points)</span></h2>
        <div id="stat-alloc">
          ${['hp','attack','defense','hacking','speed'].map(s=>`
            <div class="stat-row"><label>${s.toUpperCase()}</label>
            <button class="stat-btn" data-stat="${s}" data-dir="-1">-</button>
            <span id="bonus-${s}">+0</span>
            <button class="stat-btn" data-stat="${s}" data-dir="1">+</button></div>`).join('')}
        </div>
        <div style="text-align:center;margin-top:20px">
          <button class="btn btn-magenta" id="start-btn">JACK IN</button>
        </div>
      </div>`;
    // Class selection
    ov.querySelectorAll('.class-card').forEach(card=>{
      card.addEventListener('click',()=>{

function startHackMinigame(difficulty,onSuccess,onFail){
  G.running=false;
  const panel=document.getElementById('hack-minigame');
  panel.style.display='block';
  const symbols=['@','#','$','%','&','*','^','!','~','+'];
  const gridSize=difficulty<=3?4:6;
  const matchCount=difficulty+2;
  const timeLimit=8000+difficulty*2000;
  let targetSyms=[];
  for(let i=0;i<matchCount;i++)targetSyms.push(symbols[randInt(0,symbols.length-1)]);
  // Build grid
  let cells=[];
  for(let i=0;i<gridSize*gridSize;i++)cells.push(symbols[randInt(0,symbols.length-1)]);
  // Place targets
  let placed=0;
  let targetPositions=[];
  while(placed<matchCount){
    const idx=randInt(0,cells.length-1);
    if(!targetPositions.includes(idx)){
      cells[idx]=targetSyms[placed];
      targetPositions.push(idx);
      placed++;
    }
  }
  let matched=0;let currentTarget=0;let timeLeft=timeLimit;let hackActive=true;
  panel.innerHTML=`
    <h2 style="color:#0f0;text-align:center">// BREACH PROTOCOL //</h2>
    <p style="text-align:center;margin:8px 0">Find: <span id="hack-targets" style="color:#f0f;font-size:20px">${targetSyms.map((s,i)=>`<span id="ht-${i}">${s}</span>`).join(' ')}</span></p>
    <div id="hack-grid" style="grid-template-columns:repeat(${gridSize},1fr)">
      ${cells.map((c,i)=>`<div class="hack-cell" data-idx="${i}">${c}</div>`).join('')}
    </div>
    <div style="background:#333;height:8px;border-radius:4px;overflow:hidden"><div id="hack-timer" style="width:100%"></div></div>
    <p style="text-align:center;margin-top:8px;font-size:12px;color:#888">Click symbols in order</p>`;

  const cellEls=panel.querySelectorAll('.hack-cell');
  cellEls.forEach(cel=>{
    cel.addEventListener('click',()=>{
      if(!hackActive)return;
      const idx=parseInt(cel.dataset.idx);
      if(cells[idx]===targetSyms[currentTarget]&&targetPositions.includes(idx)){
        cel.classList.add('matched');
        const htEl=document.getElementById('ht-'+currentTarget);
        if(htEl)htEl.style.color='#0f0';
        matched++;currentTarget++;
        if(matched>=matchCount){
          hackActive=false;
          notify('HACK SUCCESSFUL!');addLog('Hack successful!','log-hack');
          setTimeout(()=>{panel.style.display='none';G.running=true;if(onSuccess)onSuccess()},800);
        }
      }else{
        cel.classList.add('wrong');
        setTimeout(()=>cel.classList.remove('wrong'),300);
      }
    });
  });
  // Timer
  let hackInterval=setInterval(()=>{
    if(!hackActive){clearInterval(hackInterval);return}
    timeLeft-=50;
    const bar=document.getElementById('hack-timer');
    if(bar)bar.style.width=(timeLeft/timeLimit*100)+'%';
    if(timeLeft<=0){
      hackActive=false;clearInterval(hackInterval);
      notify('HACK FAILED!');addLog('Hack failed!','log-dmg');
      setTimeout(()=>{panel.style.display='none';G.running=true;if(onFail)onFail()},800);
    }
  },50);
}

function switchZone(dir){
  const zoneMap={
    downtown:{left:'slums',up:'corporate',right:'downtown',down:'downtown'},
    slums:{right:'downtown',up:'industrial',left:'slums',down:'slums'},
    corporate:{down:'downtown',left:'industrial',right:'corporate',up:'corporate'},
    industrial:{down:'slums',right:'corporate',left:'industrial',up:'industrial'}
  };
  const next=zoneMap[G.zone]?zoneMap[G.zone][dir]:G.zone;
  if(next!==G.zone){
    // Deactivate current zone enemies
    G.entities.forEach(e=>{if(e.active&&e.zone===G.zone)e.active=false});
    G.zone=next;
    notify(G.zones[G.zone].name);
    // Spawn zone enemies
    for(let i=0;i<4;i++){
      const types=['grunt','enforcer','drone','cyber'];
      spawnEnemy(rand(200,1800),rand(200,1800),types[randInt(0,3)],G.zone);
    }
  }
}

  closeOverlay();

function checkMissionProgress(type){
  const m=G.activeMission;if(!m||m.complete)return;
  if(m.type==='multi'){
    m.tasks.forEach(t=>{
      if(t.type===type&&(!t.zone||t.zone===G.zone))t.progress++;
    });
    if(m.tasks.every(t=>t.progress>=t.target))completeMission(m);
  }else if(m.type===type){
    if(!m.zone||m.zone===G.zone){
      m.progress=(m.progress||0)+1;
      if(m.progress>=m.target)completeMission(m);
    }
  }
}

function completeMission(m){
  m.complete=true;
  G.credits+=m.reward.credits;G.xp+=m.reward.xp;checkLevelUp();
  notify(`Mission Complete: ${m.name}!`);
  addLog(`Completed: ${m.name} +${m.reward.credits}cr +${m.reward.xp}XP`,'log-info');
  // Auto-select next mission
  const next=G.missions.find(mm=>!mm.complete);
  if(next)G.activeMission=next;
}

window.buyItem=function(i){
  const item=G.currentShop[i];
  if(G.credits>=item.cost){
    G.credits-=item.cost;
    if(item.type==='consumable'){
      if(item.stat==='hp'){G.player.hp=Math.min(G.player.maxHp,G.player.hp+item.val);notify('Used '+item.name)}
      else{G.inventory.push({...item});notify('Bought '+item.name)}
    }else{
      // Equipment: apply stat bonus
      G.player[item.stat]=(G.player[item.stat]||0)+item.val;
      if(item.stat==='hp'){G.player.maxHp+=item.val;G.player.hp+=item.val}
      notify('Equipped '+item.name);
    }
    addLog(`Bought ${item.name} for ${item.cost}cr`,'log-info');
    openShop(G.currentShop);
  }else{notify('Not enough credits!')}
};

// ============================================================
// PHASE 3: SYSTEM BREACH - Wave Defense (PERFORMANCE CRITICAL)
// ============================================================
phases[3]={
  wave:0,
  maxWaves:8,
  waveTimer:0,
  waveSpawned:0,
  waveKilled:0,
  waveTarget:0,
  zoneIdx:0,
  breachZones:['downtown','slums','corporate','industrial'],
  enter(){
    const self=this;
    G.running=true;self.wave=0;self.zoneIdx=0;
    G.zone=self.breachZones[0];
    G.player.x=1000;G.player.y=1000;G.player.hp=G.player.maxHp;
    G.world={width:2000,height:2000};
    showHUD();
    notify('SYSTEM BREACH DETECTED - DEFEND NEO-TOKYO!');
    addLog('Wave defense initiated!','log-info');
    self.startWave();
  },
  startWave(){
    const self=this;
    self.wave++;
    if(self.wave>self.maxWaves){
      notify('ALL WAVES CLEARED!');
      setTimeout(()=>setPhase(4),2000);
      return;
    }
    // Switch zone every 2 waves
    if(self.wave>1&&(self.wave-1)%2===0){
      self.zoneIdx=(self.zoneIdx+1)%self.breachZones.length;
      G.zone=self.breachZones[self.zoneIdx];
      notify('Moving to: '+G.zones[G.zone].name);
    }
    self.waveTarget=Math.min(5+self.wave*2, MAX_ENEMIES);
    self.waveSpawned=0;self.waveKilled=0;self.waveTimer=0;
    notify(`Wave ${self.wave}/${self.maxWaves}`);
    addLog(`Wave ${self.wave} - ${self.waveTarget} enemies incoming`,'log-info');
    // Spawn initial batch (capped)
    const initialSpawn=Math.min(6,self.waveTarget,MAX_ENEMIES);
    for(let i=0;i<initialSpawn;i++){
      const types=['grunt','grunt','enforcer','drone','cyber'];
      const t=types[Math.min(randInt(0,self.wave),types.length-1)];
      const angle=Math.random()*Math.PI*2;
      const r=rand(400,800);
      spawnEnemy(G.player.x+Math.cos(angle)*r,G.player.y+Math.sin(angle)*r,t,G.zone);
      self.waveSpawned++;
    }
  },
  update(dt){
    const self=phases[3];
    if(self.wave>self.maxWaves)return;
    const activeEnemies=G.entities.filter(e=>e.active&&e.type==='enemy');
    // Wave gating: spawn more only when below threshold
    self.waveTimer-=dt;
    if(self.waveTimer<=0&&self.waveSpawned<self.waveTarget&&activeEnemies.length<WAVE_THRESHOLD){
      self.waveTimer=1500;
      const toSpawn=Math.min(3,self.waveTarget-self.waveSpawned,MAX_ENEMIES-activeEnemies.length);
      for(let i=0;i<toSpawn;i++){
        const types=['grunt','enforcer','drone','cyber'];
        const t=types[randInt(0,Math.min(self.wave-1,3))];
        const angle=Math.random()*Math.PI*2;
        const r=rand(500,900);
        const ex=clamp(G.player.x+Math.cos(angle)*r,50,1950);
        const ey=clamp(G.player.y+Math.sin(angle)*r,50,1950);
        spawnEnemy(ex,ey,t,G.zone);
        self.waveSpawned++;
      }
    }
    // Count kills
    const prevKilled=self.waveKilled;
    self.waveKilled=self.waveSpawned-activeEnemies.length;
    // Wave complete check
    if(self.waveSpawned>=self.waveTarget&&activeEnemies.length===0){
      const reward=100+self.wave*50;
      G.credits+=reward;G.xp+=self.wave*30;checkLevelUp();
      notify(`Wave ${self.wave} cleared! +${reward}cr`);
      setTimeout(()=>self.startWave(),2000);
    }
    // Toggle panels
    if(keys.i){keys.i=false;toggleInventory()}
    if(keys.escape){keys.escape=false;toggleMenu()}
    updateGameplay(dt);
  },
  render(){
    renderWorld();renderEntities();renderParticles();renderPlayer();
    // Wave indicator
    const self=phases[3];
    ctx.fillStyle='#f0f';ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText(`WAVE ${self.wave}/${self.maxWaves} - Enemies: ${G.entities.filter(e=>e.active&&e.type==='enemy').length}`,canvas.width/2,40);
  },
  exit(){
    hideDialog();closeAllPanels();G.running=false;
    // Clear ALL entities and particles for clean exit
    G.entities.forEach(e=>{e.active=false});
    G.particles.forEach(p=>{p.active=false});
  }
};

// PHASE 4: THE CORE - Final Boss

phases[4]={
  boss:null,
  bossPhase:0,
  attackTimer:0,
  patternTimer:0,
  projectiles:[],
  enter(){
    const self=this;
    G.running=true;G.zone='core';
    G.player.x=600;G.player.y=800;G.player.hp=G.player.maxHp;
    G.world={width:1200,height:1200};
    showHUD();self.projectiles=[];
    // Spawn boss
    self.boss={x:600,y:300,w:48,h:56,hp:800+G.level*50,maxHp:800+G.level*50,
      attack:25+G.level*2,defense:12,speed:1.5,color:'#f00',
      active:true,type:'enemy',enemyType:'boss',
      aiState:'idle',aiTimer:0,hitFlash:0,facing:1,
      xpVal:500,creditVal:1000,
      phase:0,attackCd:0};
    G.entities.push(self.boss);
    G.bossHP=self.boss.hp;G.bossMaxHP=self.boss.maxHp;
    G.bossName='ARCHON - THE SIMULATION CORE';
    document.getElementById('boss-hp').style.display='block';
    document.getElementById('boss-name').textContent=G.bossName;
    notify('ENTERING THE CORE...');
    addLog('Final battle: ARCHON','log-dmg');
    self.bossPhase=0;self.attackTimer=0;self.patternTimer=0;
  },
  update(dt){
    const self=phases[4];
    const boss=self.boss;
    if(!boss||!boss.active||boss.hp<=0){
      if(boss&&boss.hp<=0&&!self.victory){
        self.victory=true;
        document.getElementById('boss-hp').style.display='none';
        G.credits+=boss.creditVal;G.xp+=boss.xpVal;checkLevelUp();
        notify('ARCHON DESTROYED!');
        for(let i=0;i<30;i++)spawnParticle(boss.x,boss.y,['#f00','#f0f','#0ff','#ff0'][randInt(0,3)],1000);
        setTimeout(()=>showVictory(),3000);
      }
      return;
    }
    // Boss AI
    boss.attackCd-=dt;self.patternTimer-=dt;
    const d=dist(G.player,boss);
    // Phase transitions
    const hpPct=boss.hp/boss.maxHp;
    if(hpPct<0.3&&self.bossPhase<2){
      self.bossPhase=2;notify('ARCHON enters RAGE MODE!');boss.speed=2.5;boss.attack+=10;
    }else if(hpPct<0.6&&self.bossPhase<1){
      self.bossPhase=1;notify('ARCHON summons reinforcements!');
      for(let i=0;i<3;i++){
        const a=Math.PI*2*i/3;
        spawnEnemy(boss.x+Math.cos(a)*200,boss.y+Math.sin(a)*200,'cyber','core');
      }
    }
    // Boss movement: orbit player
    const angle=Math.atan2(G.player.y-boss.y,G.player.x-boss.x);
    if(d>200){
      boss.x+=Math.cos(angle)*boss.speed*(dt/16);
      boss.y+=Math.sin(angle)*boss.speed*(dt/16);
    }else if(d<100){
      boss.x-=Math.cos(angle)*boss.speed*(dt/16);
      boss.y-=Math.sin(angle)*boss.speed*(dt/16);
    }else{
      // Strafe
      boss.x+=Math.cos(angle+Math.PI/2)*boss.speed*0.5*(dt/16);
      boss.y+=Math.sin(angle+Math.PI/2)*boss.speed*0.5*(dt/16);
    }
    boss.x=clamp(boss.x,50,G.world.width-50);
    boss.y=clamp(boss.y,50,G.world.height-50);
    // Boss attacks
    if(boss.attackCd<=0){
      boss.attackCd=2000-self.bossPhase*400;
      // Spawn projectiles
      const projCount=3+self.bossPhase*2;
      for(let i=0;i<projCount;i++){
        const a=angle+rand(-0.5,0.5);
        self.projectiles.push({x:boss.x,y:boss.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:2000,dmg:boss.attack*0.5});
      }
      // Budget projectiles
      while(self.projectiles.length>30)self.projectiles.shift();
    }
    // Update projectiles
    for(let i=self.projectiles.length-1;i>=0;i--){
      const pr=self.projectiles[i];
      pr.x+=pr.vx*(dt/16);pr.y+=pr.vy*(dt/16);pr.life-=dt;
      if(pr.life<=0){self.projectiles.splice(i,1);continue}
      if(Math.abs(pr.x-G.player.x)<20&&Math.abs(pr.y-G.player.y)<20){
        if(G.player.invuln<=0){damageEntity(G.player,pr.dmg,boss);G.player.invuln=300}
        self.projectiles.splice(i,1);
      }
    }
    // Update boss HP bar
    G.bossHP=boss.hp;
    document.getElementById('boss-hp-fill').style.width=(boss.hp/boss.maxHp*100)+'%';
    // Hack opportunity at 50% and 25%
    if(keys.h&&d<150){
      keys.h=false;
      startHackMinigame(5+self.bossPhase,()=>{
        const hackDmg=Math.floor(boss.maxHp*0.1);
        boss.hp-=hackDmg;boss.hitFlash=300;
        notify(`NEURAL BREACH! ${hackDmg} damage!`);
        addLog(`Hacked ARCHON for ${hackDmg}!`,'log-hack');
      });
    }
    if(keys.escape){keys.escape=false;toggleMenu()}
    updateGameplay(dt);
  },
  render(){
    // Core background
    ctx.fillStyle='#050008';ctx.fillRect(0,0,canvas.width,canvas.height);
    // Grid effect
    ctx.strokeStyle='rgba(255,0,255,0.1)';ctx.lineWidth=1;
    const ox=G.camera.x%50,oy=G.camera.y%50;
    for(let x=-ox;x<canvas.width+50;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}
    for(let y=-oy;y<canvas.height+50;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}
    renderEntities();
    // Render boss
    const self=phases[4];
    if(self.boss&&self.boss.active){
      const bs=worldToScreen(self.boss.x,self.boss.y);
      // Glow
      ctx.shadowColor='#f00';ctx.shadowBlur=20+Math.sin(Date.now()/200)*10;
      ctx.fillStyle=self.boss.hitFlash>0?'#fff':'#f00';
      ctx.fillRect(bs.x-self.boss.w/2,bs.y-self.boss.h/2,self.boss.w,self.boss.h);
      // Eye
      ctx.fillStyle='#ff0';
      ctx.beginPath();ctx.arc(bs.x,bs.y-8,6+Math.sin(Date.now()/300)*2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(bs.x,bs.y-8,3,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
    // Render projectiles
    self.projectiles.forEach(pr=>{
      if(!isOnScreen(pr.x,pr.y))return;
      const ps=worldToScreen(pr.x,pr.y);
      ctx.fillStyle='#f44';ctx.shadowColor='#f00';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(ps.x,ps.y,4,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    });
    renderParticles();renderPlayer();
  },
  exit(){
    hideDialog();closeAllPanels();G.running=false;
    document.getElementById('boss-hp').style.display='none';
    this.projectiles=[];this.victory=false;
  }
};

// ============================================================
// GAMEPLAY UPDATE (shared by all action phases)
// ============================================================
function updateGameplay(dt){
  const p=G.player;if(!p)return;
  const spd=p.speed*(dt/16);
  // Movement
  let mx=0,my=0;
  if(keys.w||keys.arrowup)my=-1;
  if(keys.s||keys.arrowdown)my=1;
  if(keys.a||keys.arrowleft){mx=-1;p.facing=-1}
  if(keys.d||keys.arrowright){mx=1;p.facing=1}
  if(mx||my){const len=Math.hypot(mx,my);mx/=len;my/=len}
  p.x=clamp(p.x+mx*spd,20,G.world.width-20);
  p.y=clamp(p.y+my*spd,20,G.world.height-20);
  // Invulnerability
  if(p.invuln>0)p.invuln-=dt;
  if(p.attackTimer>0)p.attackTimer-=dt;
  // Cooldowns
  p.abilities.forEach((a,i)=>{
    if(p.cooldowns[a.type]>0){p.cooldowns[a.type]-=dt}
    const cdEl=document.getElementById('cd-'+i);
    if(cdEl){
      if(p.cooldowns[a.type]>0){cdEl.style.display='block';cdEl.textContent=Math.ceil(p.cooldowns[a.type]/1000)}
      else cdEl.style.display='none';
    }
  });
  // Attack on click
  if(mouseClicked){
    mouseClicked=false;
    const meleeAbility=p.abilities[0];
    if(p.cooldowns.melee<=0){
      p.cooldowns.melee=meleeAbility.cd;p.attacking=true;p.attackTimer=200;
      // Find nearest enemy in range
      const enemies=G.entities.filter(e=>e.active&&e.type==='enemy');
      const nearest=enemies.sort((a,b)=>dist(p,a)-dist(p,b))[0];
      if(nearest&&dist(p,nearest)<meleeAbility.range){
        damageEntity(nearest,p.attack*meleeAbility.dmgMul,p);
        for(let i=0;i<3;i++)spawnParticle(nearest.x,nearest.y,'#0ff',200);
      }
    }
  }
  // Special ability (Q key)
  if(keys.q){
    keys.q=false;
    const special=p.abilities[2];
    if(special&&p.cooldowns.cyber<=0){
      p.cooldowns.cyber=special.cd;
      const enemies=G.entities.filter(e=>e.active&&e.type==='enemy');
      if(special.type==='cyber'){
        // Neural spike - damages all in range
        enemies.forEach(e=>{
          if(dist(p,e)<special.range){
            damageEntity(e,p.attack*special.dmgMul+p.hacking,p);
            for(let i=0;i<5;i++)spawnParticle(e.x,e.y,'#f0f',400);
          }
        });
        addLog('Neural Spike!','log-hack');
      }else if(special.type==='melee'){
        // Blade storm
        enemies.forEach(e=>{
          if(dist(p,e)<special.range){
            damageEntity(e,p.attack*special.dmgMul,p);
            for(let i=0;i<5;i++)spawnParticle(e.x,e.y,'#f80',400);
          }
        });
        addLog('Blade Storm!','log-info');
      }else{
        // Turret: spawn a temporary ally
        const nearest=enemies.sort((a,b)=>dist(p,a)-dist(p,b))[0];
        if(nearest){
          damageEntity(nearest,p.attack*special.dmgMul,p);
          for(let i=0;i<8;i++)spawnParticle(p.x+p.facing*30,p.y-10,'#ff0',300);
        }
        addLog('Turret deployed!','log-info');
      }
    }
  }
  // Enemy AI
  G.entities.forEach(e=>{
    if(!e.active||e.type!=='enemy')return;
    e.hitFlash=Math.max(0,(e.hitFlash||0)-dt);
    e.attackCd=Math.max(0,(e.attackCd||0)-dt);
    e.aiTimer=(e.aiTimer||0)+1;
    const onScreen=isOnScreen(e.x,e.y,200);
    // AI throttling: off-screen enemies update every 4th frame
    if(!onScreen&&e.aiTimer%4!==0)return;
    const d2=dist(p,e);
    if(d2<300){
      // Chase player
      const ang=Math.atan2(p.y-e.y,p.x-e.x);
      e.x+=Math.cos(ang)*e.speed*(dt/16);
      e.y+=Math.sin(ang)*e.speed*(dt/16);
      e.facing=p.x>e.x?1:-1;
      // Attack
      if(d2<45&&e.attackCd<=0){
        e.attackCd=1500;
        if(p.invuln<=0){damageEntity(p,e.attack,e);p.invuln=300}
      }
    }else if(e.aiState==='patrol'){
      // Patrol
      const td=dist(e,{x:e.targetX||e.x,y:e.targetY||e.y});
      if(td<20){e.targetX=e.x+rand(-200,200);e.targetY=e.y+rand(-200,200)}
      const ang=Math.atan2((e.targetY||e.y)-e.y,(e.targetX||e.x)-e.x);
      e.x+=Math.cos(ang)*e.speed*0.5*(dt/16);
      e.y+=Math.sin(ang)*e.speed*0.5*(dt/16);
    }
    e.x=clamp(e.x,20,G.world.width-20);
    e.y=clamp(e.y,20,G.world.height-20);
  });
  // Update particles
  G.particles.forEach(pp=>{
    if(!pp.active)return;
    pp.x+=pp.vx*(dt/16);pp.y+=pp.vy*(dt/16);pp.life-=dt;
    if(pp.life<=0)pp.active=false;
  });
  updateCamera();updateHUD();
}

// ============================================================
// RENDERING
// ============================================================
function renderWorld(){
  const zd=G.zones[G.zone];
  // Background
  ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid
  const gridColor=zd?zd.color:'#0ff';
  ctx.strokeStyle=gridColor+'22';ctx.lineWidth=1;
  const ox=G.camera.x%60,oy=G.camera.y%60;
  for(let x=-ox;x<canvas.width+60;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}
  for(let y=-oy;y<canvas.height+60;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}
  // World bounds
  const tl=worldToScreen(0,0);const br=worldToScreen(G.world.width,G.world.height);
  ctx.strokeStyle='#f0055';ctx.lineWidth=2;
  ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
}

function renderZoneFeatures(){
  const zd=G.zones[G.zone];if(!zd)return;
  // NPCs
  if(zd.npcs){
    zd.npcs.forEach(npc=>{
      if(!isOnScreen(npc.x,npc.y))return;
      const s=worldToScreen(npc.x,npc.y);
      ctx.fillStyle='#0ff';ctx.fillRect(s.x-10,s.y-16,20,32);
      ctx.fillStyle='#000';ctx.fillRect(s.x-6,s.y-10,12,6);
      ctx.fillStyle='#ff0';ctx.font='10px monospace';ctx.textAlign='center';
      ctx.fillText(npc.name,s.x,s.y-22);
      if(dist(G.player,npc)<60){
        ctx.fillStyle='#0f0';ctx.fillText('[E] Talk',s.x,s.y+24);
      }
    });
  }
  // Terminals
  if(zd.terminals){
    zd.terminals.forEach(t=>{
      if(!isOnScreen(t.x,t.y))return;
      const s=worldToScreen(t.x,t.y);
      ctx.fillStyle=t.hacked?'#555':'#0f0';
      ctx.fillRect(s.x-12,s.y-12,24,24);
      ctx.strokeStyle=t.hacked?'#333':'#0ff';
      ctx.strokeRect(s.x-14,s.y-14,28,28);
      ctx.fillStyle=t.hacked?'#555':'#0f0';ctx.font='10px monospace';ctx.textAlign='center';
      ctx.fillText(t.hacked?'HACKED':'TERMINAL',s.x,s.y-18);
      if(!t.hacked&&dist(G.player,t)<60){
        ctx.fillStyle='#0f0';ctx.fillText('[H] Hack',s.x,s.y+24);
      }
    });
  }
}

function renderEntities(){
  G.entities.forEach(e=>{
    if(!e.active||e.type!=='enemy')return;
    // Viewport culling
    if(!isOnScreen(e.x,e.y))return;
    const s=worldToScreen(e.x,e.y);
    const flash=e.hitFlash>0;
    ctx.fillStyle=flash?'#fff':e.color;
    if(e.enemyType==='boss'){
      // Boss rendered separately in phase 4
      return;
    }
    ctx.fillRect(s.x-e.w/2,s.y-e.h/2,e.w,e.h);
    // Eyes
    ctx.fillStyle='#000';
    const eyeX=s.x+e.facing*3;
    ctx.fillRect(eyeX-2,s.y-e.h/4,4,3);
    // HP bar
    if(e.hp<e.maxHp){
      const bw=e.w+4;
      ctx.fillStyle='#300';ctx.fillRect(s.x-bw/2,s.y-e.h/2-8,bw,4);
      ctx.fillStyle='#f00';ctx.fillRect(s.x-bw/2,s.y-e.h/2-8,bw*(e.hp/e.maxHp),4);
    }
  });
}

function renderParticles(){
  G.particles.forEach(pp=>{
    if(!pp.active)return;
    if(!isOnScreen(pp.x,pp.y))return;
    const s=worldToScreen(pp.x,pp.y);
    const alpha=pp.life/pp.maxLife;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=pp.color;
    ctx.fillRect(s.x-pp.size/2,s.y-pp.size/2,pp.size,pp.size);
    ctx.globalAlpha=1;
  });
}

function renderPlayer(){
  const p=G.player;if(!p)return;
  const s=worldToScreen(p.x,p.y);
  // Invuln flash
  if(p.invuln>0&&Math.floor(p.invuln/100)%2===0)return;
  // Body
  ctx.fillStyle='#0ff';
  ctx.fillRect(s.x-p.w/2,s.y-p.h/2,p.w,p.h);
  // Visor
  ctx.fillStyle='#f0f';
  const visorX=s.x+p.facing*2;
  ctx.fillRect(visorX-5,s.y-p.h/4,10,4);
  // Attack visual
  if(p.attacking&&p.attackTimer>0){
    ctx.strokeStyle='#0ff';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(s.x+p.facing*20,s.y,25,0,Math.PI*2);
    ctx.stroke();
  }
  // Player name
  ctx.fillStyle='#0ff';ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText(p.name,s.x,s.y-p.h/2-8);
}

// ============================================================
// MAIN GAME LOOP (requestAnimationFrame + delta capping)
// ============================================================
function gameLoop(timestamp){
  if(!G.lastTime)G.lastTime=timestamp;
  let dt=timestamp-G.lastTime;
  G.lastTime=timestamp;
  // Delta time capping - prevents death spiral
  dt=Math.min(dt,MAX_DELTA);
  G.frameCount++;
  if(G.running&&currentPhase){
    if(currentPhase.update)currentPhase.update(dt);
  }
  // Render
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(currentPhase&&currentPhase.render)currentPhase.render();
  mouseClicked=false;
  requestAnimationFrame(gameLoop);
}

// ============================================================
// TITLE / INIT
// ============================================================
function showTitle(){
  const ov=document.getElementById('overlay-screen');
  ov.style.display='flex';
  ov.innerHTML=`<div class="overlay-panel" style="text-align:center">
    <h1 style="font-size:36px;margin-bottom:5px">THE SIMULATION</h1>
    <p style="color:#888;margin-bottom:30px">A Cyberpunk RPG</p>
    <div style="margin:20px 0">
      <button class="btn btn-magenta" id="btn-new" style="font-size:18px;padding:15px 40px">NEW GAME</button>
    </div>
    <div id="continue-div" style="display:none;margin:10px 0">
      <button class="btn btn-green" id="btn-continue" style="font-size:16px;padding:12px 30px">CONTINUE</button>
    </div>
    <p style="color:#555;font-size:11px;margin-top:20px">WASD: Move | Click: Attack | E: Interact | H: Hack | Q: Special<br>I: Inventory | M: Map | ESC: Menu</p>
  </div>`;
  document.getElementById('btn-new').addEventListener('click',()=>{
    ov.style.display='none';setPhase(0);
  });
  // Check for save
  if(localStorage.getItem('simulation_save')){
    document.getElementById('continue-div').style.display='block';
    document.getElementById('btn-continue').addEventListener('click',()=>{
      ov.style.display='none';
      G.player=makePlayer('Ghost','netrunner');
      if(loadGame()){
        setPhase(G.phase);
      }else{
        setPhase(0);
      }
    });
  }
}

// Start
showTitle();
requestAnimationFrame(gameLoop);
</script>
